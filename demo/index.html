<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloudflare Turnstile Test Page</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #160b1d; color: #f8f4fa; }
      main { width: min(560px, calc(100% - 40px)); padding: 32px; border: 1px solid #6f3b82; border-radius: 18px; background: #22102c; }
      h1 { margin-top: 0; }
      p { color: #cbbdd1; line-height: 1.5; }
      form { display: grid; gap: 20px; }
      button { width: fit-content; padding: 10px 18px; border: 0; border-radius: 8px; background: #df3f9f; color: white; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      #verification { min-height: 24px; color: #dec8e8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cloudflare Turnstile Test Page</h1>
      <p>This local page uses Cloudflare's public interactive test sitekey. It is intended for integration testing only.</p>
      <form id="demo-form">
        <div
          class="cf-turnstile"
          data-sitekey="3x00000000000000000000FF"
          data-callback="onTurnstileSolved"
        ></div>
        <button id="submit-button" type="submit" disabled>Verify token</button>
      </form>
      <p id="token-status">Waiting for a token.</p>
      <p id="verification" aria-live="polite"></p>
    </main>
    <script>
      let solvedToken = '';

      window.onTurnstileSolved = (token) => {
        solvedToken = token;
        document.querySelector('#token-status').textContent = 'Token received.';
        document.querySelector('#submit-button').disabled = false;
      };

      document.querySelector('#demo-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const output = document.querySelector('#verification');
        output.textContent = 'Verifying token...';

        const response = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token: solvedToken })
        });
        const result = await response.json();
        output.textContent = result.success ? 'Verification passed.' : `Verification failed: ${result.error}`;
        output.dataset.success = String(result.success);
      });
    </script>
  </body>
</html>
